name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the previous run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run formatting, linting, type checks, tests and the production build
        run: bun run check

  release-package:
    name: Release package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Packages twice from clean dist/ directories, so a dependency that
      # embeds a timestamp or a random identifier fails the run instead of
      # silently breaking the "one commit, one archive" guarantee.
      - name: Package and prove the archive is reproducible
        run: bun run release:verify
      - name: Write the run summary
        run: |
          {
            echo "### Release archive"
            echo
            echo '```'
            cat output/release/*.zip.files.txt
            echo '```'
            echo
            echo "SHA-256: \`$(awk '{print $1}' output/release/*.zip.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: output/release/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload the checksums and file listing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xflow-release-checksums
          path: |
            output/release/*.sha256
            output/release/*.files.txt
          if-no-files-found: error
          retention-days: 14
